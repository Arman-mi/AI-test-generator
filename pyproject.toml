[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-ai"
version = "0.1.0"
description = "LLM-assisted TDD test generator"
readme = "README.md" 
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
]

[project.scripts]
test-ai = "test_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
